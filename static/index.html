<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT25 — Monitor de Red</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3148;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.25rem; font-weight: 600; color: #a78bfa; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    #refresh-info {
      font-size: 0.8rem;
      color: #64748b;
    }

    #alerts-btn {
      position: relative;
      background: #2d3148;
      border: 1px solid #3d4258;
      color: #e2e8f0;
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.15s;
    }
    #alerts-btn:hover { background: #3d4258; }

    #alerts-count {
      background: #f87171;
      color: #1a1d2e;
      font-weight: 700;
      font-size: 0.7rem;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      min-width: 1.25rem;
      text-align: center;
    }
    #alerts-count.zero { background: #2d3148; color: #64748b; }

    .alert-item {
      padding: 0.85rem 0;
      border-bottom: 1px solid #1e2235;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .alert-item:last-child { border-bottom: none; }

    .alert-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .alert-meta { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .alert-msg { color: #e2e8f0; font-size: 0.875rem; }
    .alert-time { color: #64748b; font-size: 0.75rem; }

    .severity {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .severity.critical { background: #450a0a; color: #fca5a5; }
    .severity.high     { background: #5a1a08; color: #fdba74; }
    .severity.medium   { background: #422006; color: #fbbf24; }
    .severity.low      { background: #1e293b; color: #94a3b8; }

    .category {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .category.unclassified  { background: #1e293b; color: #94a3b8; }
    .category.suspicious    { background: #450a0a; color: #fca5a5; }
    .category.not_suspicious { background: #052e16; color: #86efac; }

    .ack-btn {
      background: #1e3a8a;
      border: none;
      color: #bfdbfe;
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .ack-btn:hover { background: #2563eb; color: #fff; }
    .ack-btn:disabled { opacity: 0.5; cursor: default; }

    .cat-btn {
      background: #1e293b;
      border: none;
      color: #94a3b8;
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .cat-btn:hover { background: #2d3148; color: #e2e8f0; }
    .cat-btn:disabled { opacity: 0.5; cursor: default; }

    .tabs {
      display: flex;
      gap: 0.25rem;
      border-bottom: 1px solid #2d3148;
      margin-bottom: 0.5rem;
    }
    .tab {
      background: none;
      border: none;
      color: #64748b;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab:hover { color: #cbd5e1; }
    .tab.active {
      color: #a78bfa;
      border-bottom-color: #a78bfa;
    }

    .alert-item.acked { opacity: 0.65; }
    .alert-item.acked .alert-msg { color: #94a3b8; }

    .alert-group-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #64748b;
      padding: 0.4rem 0;
      margin-top: 0.75rem;
      border-bottom: 1px solid #1e2235;
    }
    .alert-group-title:first-child { margin-top: 0; }

    main { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    /* ── Stats ── */
    #stats {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: #1a1d2e;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      flex: 1;
    }

    .stat-card .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
    .stat-card.total  .value { color: #a78bfa; }
    .stat-card.active .value { color: #34d399; }
    .stat-card.offline .value { color: #f87171; }

    /* ── Table ── */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1d2e;
      border: 1px solid #2d3148;
      border-radius: 8px;
      overflow: hidden;
    }

    thead { background: #12152a; }
    th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #64748b;
      border-bottom: 1px solid #2d3148;
    }

    tbody tr {
      border-bottom: 1px solid #1e2235;
      cursor: pointer;
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #20243a; }

    td { padding: 0.75rem 1rem; font-size: 0.875rem; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .badge.active  { background: #064e3b; color: #34d399; }
    .badge.offline { background: #450a0a; color: #f87171; }

    .mac { font-family: monospace; color: #94a3b8; }
    .ip  { font-family: monospace; }

    /* ── Modal ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 10;
      align-items: center;
      justify-content: center;
    }
    #overlay.open { display: flex; }

    #modal {
      background: #1a1d2e;
      border: 1px solid #2d3148;
      border-radius: 12px;
      width: 90%;
      max-width: 700px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #modal-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #2d3148;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #modal-title { font-weight: 600; color: #a78bfa; }
    #modal-close {
      background: none;
      border: none;
      color: #64748b;
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
    }
    #modal-close:hover { color: #e2e8f0; }

    #modal-body { overflow-y: auto; padding: 1rem 1.25rem; }

    .event {
      display: flex;
      gap: 1rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #1e2235;
      font-size: 0.8rem;
    }
    .event:last-child { border-bottom: none; }

    .event-time { color: #64748b; white-space: nowrap; min-width: 150px; }
    .event-type {
      font-weight: 600;
      min-width: 140px;
    }
    .event-type.device_discovered { color: #60a5fa; }
    .event-type.ip_changed        { color: #fbbf24; }
    .event-type.went_offline      { color: #f87171; }
    .event-type.came_online       { color: #34d399; }

    .event-detail { color: #94a3b8; }

    #empty { text-align: center; padding: 3rem; color: #475569; }

    /* ── Training panel ────────────────────────────────────────────────── */
    #training-btn {
      background: #2d3148;
      border: 1px solid #3d4258;
      color: #e2e8f0;
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.15s;
    }
    #training-btn:hover { background: #3d4258; }

    .train-status {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .train-status.pending  { background: #1e293b; color: #64748b; }
    .train-status.ready    { background: #1e3a8a; color: #93c5fd; }
    .train-status.trained  { background: #052e16; color: #86efac; }
    .train-status.excluded { background: #1a1d2e; color: #374151; }

    .train-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #2d3148;
      margin-bottom: 0.75rem;
    }

    .train-btn {
      background: #1e3a8a;
      border: none;
      color: #bfdbfe;
      padding: 0.4rem 0.85rem;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .train-btn:hover:not(:disabled) { background: #2563eb; color: #fff; }
    .train-btn:disabled { opacity: 0.4; cursor: default; }

    .train-row-btn {
      background: #1e293b;
      border: none;
      color: #94a3b8;
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .train-row-btn:hover:not(:disabled) { background: #1e3a8a; color: #bfdbfe; }
    .train-row-btn:disabled { opacity: 0.4; cursor: default; }

    #train-feedback {
      font-size: 0.8rem;
      color: #64748b;
      flex: 1;
    }
    #train-feedback.error { color: #f87171; }

    #modal.wide { max-width: 860px; }

    /* ── Anomaly panel ─────────────────────────────────────────────────── */
    #anomalies-btn {
      background: #2d3148;
      border: 1px solid #3d4258;
      color: #e2e8f0;
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.15s;
    }
    #anomalies-btn:hover { background: #3d4258; }

    .anom-device-sel-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.9rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #2d3148;
    }
    .anom-device-sel {
      background: #12152a;
      border: 1px solid #2d3148;
      color: #e2e8f0;
      padding: 0.4rem 0.75rem;
      border-radius: 5px;
      font-size: 0.85rem;
      flex: 1;
      cursor: pointer;
    }
    .anom-device-sel:focus { outline: none; border-color: #a78bfa; }

    .anom-refresh-btn {
      background: #1e293b;
      border: none;
      color: #94a3b8;
      padding: 0.35rem 0.75rem;
      border-radius: 5px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .anom-refresh-btn:hover { background: #2d3148; color: #e2e8f0; }

    .anom-summary {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 0.9rem;
      flex-wrap: wrap;
    }
    .anom-stat {
      background: #12152a;
      border: 1px solid #2d3148;
      border-radius: 6px;
      padding: 0.6rem 0.9rem;
      flex: 1;
      min-width: 90px;
    }
    .anom-stat-label {
      font-size: 0.68rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .anom-stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 0.2rem;
      line-height: 1.2;
    }
    .anom-stat-mono  { font-family: monospace; font-size: 1rem; }
    .anom-stat-small { font-size: 0.75rem; color: #94a3b8; margin-top: 0.3rem; }

    .anom-badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .anom-badge.anomaly { background: #450a0a; color: #fca5a5; }
    .anom-badge.normal  { background: #1e293b; color: #64748b; }

    .anom-row             { background: rgba(248,113,113,0.05); }
    .anom-row:hover       { background: rgba(248,113,113,0.10) !important; }

    .feat-detail-row      { display: none; background: #12152a; cursor: default; }
    .feat-detail-row:hover { background: #12152a !important; }
    .feat-detail-row.open { display: table-row; }

    .feat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 0.45rem 1.25rem;
      padding: 0.7rem 1rem;
    }
    .feat-item-label { font-size: 0.68rem; color: #64748b; text-transform: uppercase; letter-spacing:.03em; }
    .feat-item-val   { font-family: monospace; font-size: 0.82rem; color: #e2e8f0; margin-top: 0.1rem; }

    .score-bar-wrap { display: flex; align-items: center; gap: 0.4rem; }
    .score-bar-bg   { background: #2d3148; border-radius: 2px; width: 48px; height: 5px; overflow: hidden; flex-shrink: 0; }
    .score-bar-fill { height: 100%; border-radius: 2px; }

    /* Sortable headers (MEJORA 2) */
    th.sort-th { cursor: pointer; user-select: none; white-space: nowrap; }
    th.sort-th:hover { color: #a78bfa; }
    .sort-arrow { color: #3d4258; font-size: 0.7rem; margin-left: 0.3rem; transition: color 0.15s; }
    th.sort-th.sort-active .sort-arrow { color: #a78bfa; }

    /* Filter bar above devices table (MEJORA 3) */
    #device-filter-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0 0.5rem;
    }
    #device-filter-bar span { font-size: 0.78rem; color: #64748b; }
    .filter-btn {
      background: #2d3148;
      border: 1px solid #3d4258;
      color: #94a3b8;
      padding: 0.28rem 0.7rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .filter-btn:hover { background: #3d4258; }
    .filter-btn.filter-on { background: #1e3a8a; border-color: #3b82f6; color: #bfdbfe; }

    /* Anomaly badge in device rows (MEJORA 4) */
    .dev-anom-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: #422006;
      color: #fb923c;
      padding: 0.13rem 0.45rem;
      border-radius: 999px;
      font-size: 0.67rem;
      font-weight: 700;
    }
    .dismiss-anom-btn {
      background: none;
      border: 1px solid #3d4258;
      color: #64748b;
      padding: 0.18rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.68rem;
      margin-left: 0.35rem;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .dismiss-anom-btn:hover { background: #1e293b; color: #e2e8f0; }
  </style>
</head>
<body>

<header>
  <h1>IoT25 — Monitor de Red</h1>
  <div class="header-right">
    <button id="anomalies-btn" type="button" title="Ver anomalías detectadas por el modelo">
      ⚠️ Anomalías
    </button>
    <button id="training-btn" type="button" title="Gestionar entrenamiento de modelos">
      🧠 Entrenamiento
    </button>
    <button id="alerts-btn" type="button" title="Ver alertas activas">
      🔔 Alertas <span id="alerts-count" class="zero">0</span>
    </button>
    <span id="refresh-info">Actualizando cada 30s…</span>
  </div>
</header>

<main>
  <div id="stats">
    <div class="stat-card total">
      <div class="label">Total dispositivos</div>
      <div class="value" id="count-total">—</div>
    </div>
    <div class="stat-card active">
      <div class="label">Activos</div>
      <div class="value" id="count-active">—</div>
    </div>
    <div class="stat-card offline">
      <div class="label">Offline</div>
      <div class="value" id="count-offline">—</div>
    </div>
  </div>

  <div id="device-filter-bar">
    <span>Mostrar:</span>
    <button class="filter-btn" id="filter-active-btn">Solo activos</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>MAC</th>
        <th>IP</th>
        <th>Hostname</th>
        <th>Vendor</th>
        <th>Tipo</th>
        <th>Estado</th>
        <th>Último visto</th>
        <th>Anomalía</th>
      </tr>
    </thead>
    <tbody id="devices-body">
      <tr><td colspan="8" id="empty">Cargando…</td></tr>
    </tbody>
  </table>
</main>

<!-- Modal historial -->
<div id="overlay">
  <div id="modal">
    <div id="modal-header">
      <span id="modal-title">Historial</span>
      <button id="modal-close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
  const EVENT_LABELS = {
    device_discovered: 'Descubierto',
    ip_changed:        'IP cambiada',
    went_offline:      'Fue offline',
    came_online:       'Volvió online',
  };

  const CAT_LABELS = {
    unclassified:   'Sin clasificar',
    suspicious:     'Sospechoso',
    not_suspicious: 'No sospechoso',
  };
  const ALL_CATS = [
    { value: 'suspicious',     label: 'Sospechoso' },
    { value: 'not_suspicious', label: 'No sospechoso' },
    { value: 'unclassified',   label: 'Sin clasificar' },
  ];

  function fmtDate(iso) {
    return new Date(iso).toLocaleString('es-AR');
  }

  let _allDevices = [];
  let _filterActiveOnly = false;
  let _anomDeviceIds = new Set();  // device_ids con alertas de anomalía activas

  function renderDeviceTable() {
    const tbody = document.getElementById('devices-body');
    const list  = _filterActiveOnly
      ? _allDevices.filter(d => d.status === 'active')
      : _allDevices;

    if (list.length === 0) {
      const msg = _filterActiveOnly
        ? 'No hay dispositivos activos en este momento.'
        : 'Sin dispositivos detectados aún.';
      tbody.innerHTML = `<tr><td colspan="8" id="empty">${msg}</td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(d => {
      const hasAnom = _anomDeviceIds.has(d.id);
      const anomCell = hasAnom
        ? `<span class="dev-anom-badge">⚠ Sin revisar</span>
           <button class="dismiss-anom-btn" data-dev-id="${d.id}">Revisado ✓</button>`
        : '—';
      return `
        <tr data-mac="${escapeHtml(d.mac)}" data-id="${d.id}">
          <td class="mac">${escapeHtml(d.mac)}</td>
          <td class="ip">${escapeHtml(d.ip ?? '—')}</td>
          <td>${escapeHtml(d.hostname ?? '—')}</td>
          <td>${escapeHtml(d.vendor ?? '—')}</td>
          <td>${escapeHtml(d.device_type ?? '—')}</td>
          <td><span class="badge ${escapeHtml(d.status)}">${escapeHtml(d.status)}</span></td>
          <td style="white-space:nowrap">${fmtDate(d.last_seen)}</td>
          <td style="white-space:nowrap">${anomCell}</td>
        </tr>`;
    }).join('');

    tbody.querySelectorAll('tr[data-mac]').forEach(row => {
      row.addEventListener('click', () =>
        openDevice(row.dataset.mac, parseInt(row.dataset.id, 10))
      );
    });

    tbody.querySelectorAll('button.dismiss-anom-btn').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const devId = parseInt(btn.dataset.devId, 10);
        btn.disabled = true;
        btn.textContent = 'Marcando…';
        try {
          await fetch(`/api/devices/${devId}/dismiss-anomalies`, { method: 'POST' });
          _anomDeviceIds.delete(devId);
          renderDeviceTable();
          refreshAlertsCount();
        } catch {
          btn.disabled = false;
          btn.textContent = 'Reintentar';
        }
      });
    });
  }

  async function loadDevices() {
    const [devRes, alertRes] = await Promise.all([
      fetch('/api/devices'),
      fetch('/api/alerts/active'),
    ]);
    _allDevices = await devRes.json();
    const activeAlerts = await alertRes.json().catch(() => []);

    _anomDeviceIds = new Set(
      activeAlerts
        .filter(a => a.type === 'anomaly_iforest')
        .map(a => a.device_id)
    );

    document.getElementById('count-total').textContent   = _allDevices.length;
    document.getElementById('count-active').textContent  = _allDevices.filter(d => d.status === 'active').length;
    document.getElementById('count-offline').textContent = _allDevices.filter(d => d.status === 'offline').length;

    renderDeviceTable();

    document.getElementById('refresh-info').textContent =
      'Última actualización: ' + new Date().toLocaleTimeString('es-AR');
  }

  document.getElementById('filter-active-btn').addEventListener('click', () => {
    _filterActiveOnly = !_filterActiveOnly;
    const btn = document.getElementById('filter-active-btn');
    btn.classList.toggle('filter-on', _filterActiveOnly);
    btn.textContent = _filterActiveOnly ? 'Todos' : 'Solo activos';
    renderDeviceTable();
  });

  let _deviceTab = 'events';
  let _currentDeviceMac = null;
  let _currentDeviceId = null;

  async function openDevice(mac, deviceId) {
    _currentDeviceMac = mac;
    _currentDeviceId = deviceId;
    document.getElementById('modal-title').textContent = `Dispositivo — ${mac}`;
    document.getElementById('modal-body').innerHTML = `
      <div class="tabs">
        <button class="tab ${_deviceTab === 'events' ? 'active' : ''}" data-tab="events">Eventos</button>
        <button class="tab ${_deviceTab === 'dns' ? 'active' : ''}" data-tab="dns">DNS</button>
        <button class="tab ${_deviceTab === 'tls' ? 'active' : ''}" data-tab="tls">TLS</button>
      </div>
      <div id="device-content"><p style="color:#64748b;padding:1rem">Cargando…</p></div>
    `;
    document.getElementById('overlay').classList.add('open');

    document.querySelectorAll('#modal-body .tab').forEach(btn => {
      btn.addEventListener('click', () => {
        _deviceTab = btn.dataset.tab;
        document.querySelectorAll('#modal-body .tab').forEach(t =>
          t.classList.toggle('active', t.dataset.tab === _deviceTab)
        );
        renderDeviceTab();
      });
    });

    await renderDeviceTab();
  }

  async function renderDeviceTab() {
    const c = document.getElementById('device-content');
    if (!c) return;
    if (_deviceTab === 'events') return renderEvents(c);
    if (_deviceTab === 'dns')    return renderDns(c);
    if (_deviceTab === 'tls')    return renderTls(c);
  }

  async function renderEvents(c) {
    const res = await fetch(`/api/devices/${_currentDeviceMac}/history`);
    const events = await res.json();
    if (events.length === 0) {
      c.innerHTML = '<p style="color:#64748b;padding:1rem">Sin eventos registrados.</p>';
      return;
    }
    c.innerHTML = events.map(e => {
      const label = EVENT_LABELS[e.event_type] ?? e.event_type;
      let detail = '';
      if (e.old_value && e.new_value) detail = `${escapeHtml(e.old_value)} → ${escapeHtml(e.new_value)}`;
      else if (e.new_value)            detail = escapeHtml(e.new_value);
      return `
        <div class="event">
          <span class="event-time">${fmtDate(e.timestamp)}</span>
          <span class="event-type ${escapeHtml(e.event_type)}">${escapeHtml(label)}</span>
          <span class="event-detail">${detail}</span>
        </div>
      `;
    }).join('');
  }

  async function renderDns(c) {
    const res = await fetch(`/api/devices/${_currentDeviceId}/dns?limit=100`);
    const data = await res.json();
    if (!data.items || data.items.length === 0) {
      c.innerHTML = '<p style="color:#64748b;padding:1rem">Sin queries DNS registradas.</p>';
      return;
    }
    c.innerHTML =
      `<p style="color:#64748b;font-size:0.75rem;padding:0.4rem 0">${data.total} queries totales</p>` +
      data.items.map(d => {
        const sus = d.is_suspicious === 1 || d.is_suspicious === true;
        return `
          <div class="event">
            <span class="event-time">${fmtDate(d.timestamp)}</span>
            <span class="event-type" style="color:${sus ? '#f87171' : '#60a5fa'}">${escapeHtml(d.record_type ?? '?')}</span>
            <span class="event-detail">
              ${escapeHtml(d.domain)}
              ${sus ? ' <span class="severity high">sospechoso</span>' : ''}
            </span>
          </div>
        `;
      }).join('');
  }

  async function renderTls(c) {
    const res = await fetch(`/api/devices/${_currentDeviceId}/tls?limit=100`);
    const data = await res.json();
    if (!data.items || data.items.length === 0) {
      c.innerHTML = '<p style="color:#64748b;padding:1rem">Sin fingerprints TLS registrados.</p>';
      return;
    }
    c.innerHTML =
      `<p style="color:#64748b;font-size:0.75rem;padding:0.4rem 0">${data.total} fingerprints totales</p>` +
      data.items.map(t => `
        <div class="event">
          <span class="event-time">${fmtDate(t.timestamp)}</span>
          <span class="event-type" style="color:#a78bfa;font-family:monospace" title="${escapeHtml(t.ja3_string ?? '')}">${escapeHtml(t.ja3_hash.substring(0, 12))}…</span>
          <span class="event-detail" style="font-family:monospace">${escapeHtml(t.dst_ip)}:${t.dst_port}</span>
        </div>
      `).join('');
  }

  // (modal-close y overlay-click se manejan en la sección de training más abajo)

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  async function refreshAlertsCount() {
    try {
      const res = await fetch('/api/alerts/active');
      const alerts = await res.json();
      const badge = document.getElementById('alerts-count');
      badge.textContent = alerts.length;
      badge.classList.toggle('zero', alerts.length === 0);
    } catch (e) {
      // ignore — header badge is best-effort
    }
  }

  let _alertsTab = 'active';

  async function openAlerts() {
    document.getElementById('modal-title').textContent = 'Alertas';
    document.getElementById('modal-body').innerHTML = `
      <div class="tabs">
        <button class="tab ${_alertsTab === 'active' ? 'active' : ''}" data-tab="active">Activas</button>
        <button class="tab ${_alertsTab === 'history' ? 'active' : ''}" data-tab="history">Historial</button>
        <button class="tab ${_alertsTab === 'suspicious' ? 'active' : ''}" data-tab="suspicious">Sospechosas</button>
        <button class="tab ${_alertsTab === 'not_suspicious' ? 'active' : ''}" data-tab="not_suspicious">No sospechosas</button>
      </div>
      <div id="alerts-list">
        <p style="color:#64748b;padding:1rem">Cargando…</p>
      </div>
    `;
    document.getElementById('overlay').classList.add('open');

    document.querySelectorAll('#modal-body .tab').forEach(btn => {
      btn.addEventListener('click', () => {
        _alertsTab = btn.dataset.tab;
        document.querySelectorAll('#modal-body .tab').forEach(t =>
          t.classList.toggle('active', t.dataset.tab === _alertsTab)
        );
        renderAlerts();
      });
    });

    await renderAlerts();
  }

  function renderAlertItem(a) {
    const isAcked = a.acknowledged === 1 || a.acknowledged === true;
    const action = isAcked
      ? '<span class="alert-time">vista</span>'
      : `<button class="ack-btn" data-ack="${a.id}">Marcar como vista</button>`;

    const cat = a.category ?? 'unclassified';
    const catLabel = CAT_LABELS[cat] ?? 'Sin clasificar';
    const catBtns = ALL_CATS
      .filter(c => c.value !== cat)
      .map(c => `<button class="cat-btn" data-cat-id="${a.id}" data-cat-value="${c.value}">${c.label}</button>`)
      .join('');

    return `
      <div class="alert-item ${isAcked ? 'acked' : ''}" data-id="${a.id}">
        <div class="alert-row">
          <div class="alert-meta">
            <span class="severity ${escapeHtml(a.severity)}">${escapeHtml(a.severity)}</span>
            <span class="category ${cat}">${catLabel}</span>
            <span class="alert-msg">${escapeHtml(a.message)}</span>
          </div>
          ${action}
        </div>
        <div class="alert-row" style="justify-content:flex-start;gap:0.4rem;margin-top:0.2rem">
          ${catBtns}
        </div>
        <span class="alert-time">${escapeHtml(a.type)} · ${fmtDate(a.timestamp)}</span>
      </div>
    `;
  }

  async function renderAlerts() {
    const list = document.getElementById('alerts-list');
    if (!list) return;

    const isCategoryTab = _alertsTab === 'suspicious' || _alertsTab === 'not_suspicious';

    let url;
    if (_alertsTab === 'active') {
      url = '/api/alerts/active';
    } else if (_alertsTab === 'history') {
      url = '/api/alerts?acknowledged=true&limit=200';
    } else {
      url = `/api/alerts?category=${_alertsTab}&limit=200`;
    }

    const res = await fetch(url);
    const alerts = await res.json();

    if (alerts.length === 0) {
      const msgs = {
        active:        'No hay alertas activas.',
        history:       'Sin alertas previas.',
        suspicious:    'No hay alertas en esta categoría.',
        not_suspicious: 'No hay alertas en esta categoría.',
      };
      list.innerHTML = `<p style="color:#64748b;padding:1rem">${msgs[_alertsTab]}</p>`;
      return;
    }

    if (isCategoryTab) {
      const unacked = alerts.filter(a => !(a.acknowledged === 1 || a.acknowledged === true));
      const acked   = alerts.filter(a =>   a.acknowledged === 1 || a.acknowledged === true);
      let html = '';
      if (unacked.length > 0) html += '<p class="alert-group-title">Activas</p>' + unacked.map(renderAlertItem).join('');
      if (acked.length > 0)   html += '<p class="alert-group-title">Vistas</p>'  + acked.map(renderAlertItem).join('');
      list.innerHTML = html;
    } else {
      list.innerHTML = alerts.map(renderAlertItem).join('');
    }

    list.querySelectorAll('button[data-ack]').forEach(btn => {
      btn.addEventListener('click', () => acknowledgeAlert(parseInt(btn.dataset.ack, 10), btn));
    });

    list.querySelectorAll('button[data-cat-id]').forEach(btn => {
      btn.addEventListener('click', () =>
        setCategory(parseInt(btn.dataset.catId, 10), btn.dataset.catValue, btn)
      );
    });
  }

  async function acknowledgeAlert(id, btn) {
    btn.disabled = true;
    btn.textContent = 'Marcando…';
    const res = await fetch(`/api/alerts/${id}/acknowledge`, { method: 'POST' });
    if (!res.ok) {
      btn.disabled = false;
      btn.textContent = 'Reintentar';
      return;
    }
    await renderAlerts();
    refreshAlertsCount();
  }

  async function setCategory(id, category, btn) {
    btn.disabled = true;
    const prev = btn.textContent;
    btn.textContent = 'Guardando…';
    const res = await fetch(`/api/alerts/${id}/category?category=${category}`, { method: 'POST' });
    if (!res.ok) {
      btn.disabled = false;
      btn.textContent = prev;
      return;
    }
    await renderAlerts();
  }

  // ── Training panel ────────────────────────────────────────────────────────

  const TRAIN_STATUS_LABELS = {
    pending:  'Pendiente',
    ready:    'Listo',
    trained:  'Entrenado',
    excluded: 'Excluido',
  };

  function setTrainFeedback(msg, isError = false) {
    const el = document.getElementById('train-feedback');
    if (!el) return;
    el.textContent = msg;
    el.className = isError ? 'error' : '';
  }

  function updateSelCount() {
    const count = document.querySelectorAll('.train-cb:checked').length;
    const btn   = document.getElementById('train-sel-btn');
    if (!btn) return;
    btn.disabled = count === 0;
    btn.textContent = `Entrenar seleccionados (${count})`;
  }

  function renderTrainingRow(d) {
    const status    = d.status ?? 'pending';
    const canTrain  = status === 'ready' || status === 'trained';
    const label     = TRAIN_STATUS_LABELS[status] ?? status;
    const trainedAt = d.training_date
      ? `<span style="color:#64748b;font-size:0.73rem;display:block;margin-top:0.15rem">${fmtDate(d.training_date)}</span>`
      : '';
    return `
      <tr id="train-row-${d.device_id}">
        <td style="text-align:center;width:2.5rem">
          <input type="checkbox" class="train-cb" id="train-cb-${d.device_id}"
                 data-id="${d.device_id}" ${canTrain ? '' : 'disabled'}>
        </td>
        <td>
          <span class="ip">${escapeHtml(d.ip ?? '—')}</span>
          ${d.hostname ? `<span style="color:#64748b;font-size:0.8rem"> / ${escapeHtml(d.hostname)}</span>` : ''}
        </td>
        <td style="text-align:right">${d.n_windows ?? 0}</td>
        <td>
          <span class="train-status ${escapeHtml(status)}">${escapeHtml(label)}</span>
          ${trainedAt}
        </td>
        <td>
          <button class="train-row-btn" data-id="${d.device_id}" ${canTrain ? '' : 'disabled'}>
            ${status === 'trained' ? 'Reentrenar' : 'Entrenar'}
          </button>
        </td>
      </tr>`;
  }

  function renderTrainingTable(data) {
    const wrap = document.getElementById('training-table-wrap');
    if (!wrap) return;
    if (!data || data.length === 0) {
      wrap.innerHTML = '<p style="color:#64748b;padding:0.75rem 0">Sin dispositivos registrados.</p>';
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th style="width:2.5rem;text-align:center">
              <input type="checkbox" id="train-check-all" title="Seleccionar todos los entrenables">
            </th>
            <th>IP / Hostname</th>
            <th style="text-align:right">Ventanas</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="training-tbody">
          ${data.map(renderTrainingRow).join('')}
        </tbody>
      </table>`;

    document.getElementById('train-check-all').addEventListener('change', e => {
      document.querySelectorAll('.train-cb:not(:disabled)').forEach(cb => {
        cb.checked = e.target.checked;
      });
      updateSelCount();
    });

    document.querySelectorAll('.train-cb').forEach(cb => {
      cb.addEventListener('change', updateSelCount);
    });

    document.querySelectorAll('.train-row-btn').forEach(btn => {
      btn.addEventListener('click', () => trainOneDevice(parseInt(btn.dataset.id, 10)));
    });
  }

  async function loadTrainingStatus() {
    const wrap = document.getElementById('training-table-wrap');
    if (!wrap) return;
    try {
      const res  = await fetch('/api/training/status');
      const data = await res.json();
      renderTrainingTable(data);
    } catch {
      wrap.innerHTML = '<p style="color:#f87171;padding:0.75rem 0">Error al cargar el estado.</p>';
    }
  }

  function setTrainingBusy(busy) {
    document.querySelectorAll('.train-btn, .train-row-btn').forEach(b => {
      b.disabled = busy;
    });
    if (!busy) updateSelCount();
  }

  async function trainOneDevice(id) {
    const row       = document.getElementById(`train-row-${id}`);
    const rowBtn    = row ? row.querySelector('.train-row-btn') : null;
    const statusEl  = row ? row.querySelector('.train-status') : null;

    if (rowBtn) { rowBtn.disabled = true; rowBtn.textContent = 'Entrenando…'; }
    setTrainFeedback('Entrenando…');

    try {
      const res  = await fetch(`/api/devices/${id}/train`, { method: 'POST' });
      const data = await res.json();
      if (res.ok) {
        if (rowBtn)   { rowBtn.disabled = false; rowBtn.textContent = 'Reentrenar'; }
        if (statusEl) { statusEl.className = 'train-status trained'; statusEl.textContent = 'Entrenado'; }
        setTrainFeedback(
          `Dispositivo ${id}: ${data.n_samples} ventanas, umbral ${data.threshold?.toFixed(4)}.`
        );
      } else {
        if (rowBtn)  { rowBtn.disabled = false; rowBtn.textContent = 'Entrenar'; }
        setTrainFeedback(`Error: ${data.detail ?? 'desconocido'}`, true);
      }
    } catch {
      if (rowBtn) { rowBtn.disabled = false; rowBtn.textContent = 'Entrenar'; }
      setTrainFeedback('Error de conexión.', true);
    }
  }

  async function trainAll() {
    setTrainingBusy(true);
    setTrainFeedback('Entrenando todos los dispositivos listos…');
    try {
      const res  = await fetch('/api/training/train', { method: 'POST' });
      const data = await res.json();
      setTrainFeedback(`${data.trained} entrenado(s), ${data.skipped} omitido(s).`);
      await loadTrainingStatus();
    } catch {
      setTrainFeedback('Error de conexión.', true);
    } finally {
      setTrainingBusy(false);
    }
  }

  async function trainSelected() {
    const ids = [...document.querySelectorAll('.train-cb:checked')]
      .map(cb => parseInt(cb.dataset.id, 10));
    if (ids.length === 0) return;

    setTrainingBusy(true);
    setTrainFeedback(`Entrenando ${ids.length} dispositivo(s) seleccionado(s)…`);
    try {
      const res  = await fetch('/api/training/train-selected', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ device_ids: ids }),
      });
      const data = await res.json();
      setTrainFeedback(`${data.trained} entrenado(s), ${data.skipped} omitido(s).`);
      await loadTrainingStatus();
    } catch {
      setTrainFeedback('Error de conexión.', true);
    } finally {
      setTrainingBusy(false);
    }
  }

  function openTraining() {
    document.getElementById('modal-title').textContent = 'Entrenamiento de modelos';
    document.getElementById('modal').classList.add('wide');
    document.getElementById('modal-body').innerHTML = `
      <div class="train-actions">
        <button id="train-all-btn" class="train-btn">Entrenar todos</button>
        <button id="train-sel-btn" class="train-btn" disabled>Entrenar seleccionados (0)</button>
        <span id="train-feedback"></span>
      </div>
      <div id="training-table-wrap">
        <p style="color:#64748b;padding:0.75rem 0">Cargando…</p>
      </div>`;
    document.getElementById('overlay').classList.add('open');

    document.getElementById('train-all-btn').addEventListener('click', trainAll);
    document.getElementById('train-sel-btn').addEventListener('click', trainSelected);

  // Limpiar clase wide al cerrar el modal (cualquier vía)
  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('modal').classList.remove('wide');
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', e => {

  // ── Anomaly panel ─────────────────────────────────────────────────────────

  const FEAT_LABELS = {
    n_flows:          'Flujos',
    bytes_total:      'Bytes totales',
    bytes_mean:       'Bytes/flujo',
    packets_total:    'Paquetes totales',
    packets_mean:     'Paquetes/flujo',
    n_dst_ips:        'IPs destino',
    n_dst_ports:      'Puertos destino',
    duration_mean_ms: 'Duración media',
    pct_tcp:          'TCP',
    pct_udp:          'UDP',
    pct_other:        'Otros proto',
  };

  function fmtFeature(name, val) {
    if (name.startsWith('pct_')) return (val * 100).toFixed(1) + '%';
    if (name === 'bytes_total' || name === 'bytes_mean') {
      if (val >= 1e6) return (val / 1e6).toFixed(2) + ' MB';
      if (val >= 1e3) return (val / 1e3).toFixed(1) + ' KB';
      return Math.round(val) + ' B';
    }
    if (name === 'duration_mean_ms') {
      if (val >= 60000) return (val / 60000).toFixed(1) + ' min';
      if (val >= 1000)  return (val / 1000).toFixed(2) + ' s';
      return Math.round(val) + ' ms';
    }
    if (val === Math.floor(val)) return val.toFixed(0);
    return val.toFixed(2);
  }

  function renderFeatureGrid(features) {
    return '<div class="feat-grid">' +
      Object.entries(FEAT_LABELS).map(([key, label]) => {
        const val = features[key];
        return `<div>
          <div class="feat-item-label">${label}</div>
          <div class="feat-item-val">${val != null ? fmtFeature(key, val) : '—'}</div>
        </div>`;
      }).join('') +
      '</div>';
  }

  let _anomSort = { col: 'score', asc: false };
  let _anomWindows = null;

  function sortedAnomalyWindows(windows) {
    return [...windows].sort((a, b) => {
      let va, vb;
      if (_anomSort.col === 'date') {
        va = a.window_start ?? '';
        vb = b.window_start ?? '';
      } else if (_anomSort.col === 'status') {
        va = a.is_anomaly ? 1 : 0;
        vb = b.is_anomaly ? 1 : 0;
      } else {
        va = a.score;
        vb = b.score;
      }
      if (va < vb) return _anomSort.asc ? -1 : 1;
      if (va > vb) return _anomSort.asc ? 1 : -1;
      return 0;
    });
  }

  function anomSortArrow(col) {
    const active = _anomSort.col === col;
    const arrow  = active ? (_anomSort.asc ? '↑' : '↓') : '↕';
    return `<span class="sort-arrow">${arrow}</span>`;
  }

  function renderAnomalyTable(windows) {
    if (!windows || windows.length === 0)
      return '<p style="color:#64748b;padding:0.75rem 0">Sin ventanas de datos.</p>';

    const sorted = sortedAnomalyWindows(windows);

    const rows = sorted.map((w, i) => {
      const isAnom     = w.is_anomaly;
      const scoreColor = isAnom ? '#f87171' : '#64748b';
      const scorePct   = Math.min(100, Math.round(w.score * 100));
      const time       = w.window_start ? fmtDate(w.window_start) : '—';
      return `
        <tr class="${isAnom ? 'anom-row' : ''}" data-anom-idx="${i}"
            title="Clic para ver detalles de la ventana">
          <td style="color:#94a3b8;font-size:0.78rem;white-space:nowrap">${escapeHtml(time)}</td>
          <td>
            <div class="score-bar-wrap">
              <div class="score-bar-bg">
                <div class="score-bar-fill" style="width:${scorePct}%;background:${scoreColor}"></div>
              </div>
              <span style="font-family:monospace;font-size:0.82rem;color:${scoreColor}">${w.score.toFixed(4)}</span>
            </div>
          </td>
          <td><span class="anom-badge ${isAnom ? 'anomaly' : 'normal'}">${isAnom ? 'Anomalía' : 'Normal'}</span></td>
        </tr>
        <tr class="feat-detail-row" id="anom-detail-${i}">
          <td colspan="3">${renderFeatureGrid(w.features)}</td>
        </tr>`;
    }).join('');

    const activeCol = _anomSort.col;
    return `
      <table>
        <thead>
          <tr>
            <th class="sort-th ${activeCol === 'date' ? 'sort-active' : ''}" data-sort-col="date">
              Ventana (inicio)${anomSortArrow('date')}
            </th>
            <th class="sort-th ${activeCol === 'score' ? 'sort-active' : ''}" data-sort-col="score">
              Score${anomSortArrow('score')}
            </th>
            <th class="sort-th ${activeCol === 'status' ? 'sort-active' : ''}" data-sort-col="status">
              Estado${anomSortArrow('status')}
            </th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function bindAnomalyTableHandlers(container) {
    container.querySelectorAll('th[data-sort-col]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.sortCol;
        if (_anomSort.col === col) {
          _anomSort.asc = !_anomSort.asc;
        } else {
          _anomSort.col = col;
          _anomSort.asc = col === 'date';  // fecha: ascendente por defecto (más antigua primero)
        }
        const wrap = document.getElementById('anom-table-wrap');
        if (wrap && _anomWindows) {
          wrap.innerHTML = renderAnomalyTable(_anomWindows);
          bindAnomalyTableHandlers(wrap);
        }
      });
    });
    container.querySelectorAll('tr[data-anom-idx]').forEach(row => {
      row.addEventListener('click', () => {
        const det = document.getElementById(`anom-detail-${row.dataset.anomIdx}`);
        if (det) det.classList.toggle('open');
      });
    });
  }

  function renderAnomalySummary(data) {
    const n   = data.n_anomalies;
    const pct = data.n_windows > 0 ? (n / data.n_windows * 100).toFixed(1) : '0.0';
    return `
      <div class="anom-summary">
        <div class="anom-stat">
          <div class="anom-stat-label">Ventanas analizadas</div>
          <div class="anom-stat-value">${data.n_windows}</div>
        </div>
        <div class="anom-stat">
          <div class="anom-stat-label">Anomalías detectadas</div>
          <div class="anom-stat-value" style="color:${n > 0 ? '#f87171' : '#34d399'}">
            ${n}
            <span style="font-size:0.9rem;font-weight:400;color:#64748b"> (${pct}%)</span>
          </div>
        </div>
        <div class="anom-stat">
          <div class="anom-stat-label">Umbral del modelo</div>
          <div class="anom-stat-value anom-stat-mono">${data.threshold.toFixed(4)}</div>
        </div>
        <div class="anom-stat" style="flex:2">
          <div class="anom-stat-label">Modelo entrenado</div>
          <div class="anom-stat-small">${fmtDate(data.model_trained_at)}</div>
        </div>
      </div>`;
  }

  async function loadAnomalies(deviceId) {
    const content = document.getElementById('anom-content');
    if (!content) return;
    content.innerHTML = '<p style="color:#64748b;padding:0.75rem 0">Cargando…</p>';
    _anomWindows = null;

    try {
      const res = await fetch(`/api/devices/${deviceId}/anomalies`);

      if (res.status === 409) {
        content.innerHTML = `
          <p style="color:#fbbf24;padding:0.75rem 0">
            Este dispositivo no tiene modelo entrenado.<br>
            Entrená el dispositivo desde el panel <strong>🧠 Entrenamiento</strong> primero.
          </p>`;
        return;
      }
      if (!res.ok) {
        content.innerHTML = '<p style="color:#f87171;padding:0.75rem 0">Error al cargar anomalías.</p>';
        return;
      }

      const data = await res.json();
      _anomWindows = data.windows;

      content.innerHTML =
        renderAnomalySummary(data) +
        '<div id="anom-table-wrap">' + renderAnomalyTable(data.windows) + '</div>';

      bindAnomalyTableHandlers(content);
    } catch {
      content.innerHTML = '<p style="color:#f87171;padding:0.75rem 0">Error de conexión.</p>';
    }
  }

  async function openAnomalies() {
    document.getElementById('modal-title').textContent = 'Anomalías de detección';
    document.getElementById('modal').classList.add('wide');
    document.getElementById('modal-body').innerHTML = `
      <div class="anom-device-sel-wrap">
        <select id="anom-device-sel" class="anom-device-sel">
          <option value="">Cargando dispositivos…</option>
        </select>
        <button id="anom-refresh-btn" class="anom-refresh-btn">↺ Actualizar</button>
      </div>
      <div id="anom-content">
        <p style="color:#64748b;padding:0.75rem 0">Seleccioná un dispositivo para ver sus anomalías.</p>
      </div>`;
    document.getElementById('overlay').classList.add('open');

    document.getElementById('anom-refresh-btn').addEventListener('click', () => {
      const sel = document.getElementById('anom-device-sel');
      if (sel && sel.value) loadAnomalies(parseInt(sel.value, 10));
    });

    try {
      const res     = await fetch('/api/training/status');
      const data    = await res.json();
      const trained = data.filter(d => d.status === 'trained');
      const sel     = document.getElementById('anom-device-sel');
      if (!sel) return;

      if (trained.length === 0) {
        sel.innerHTML = '<option value="">Sin dispositivos entrenados</option>';
        document.getElementById('anom-content').innerHTML = `
          <p style="color:#64748b;padding:0.75rem 0">
            No hay dispositivos con modelo entrenado todavía.<br>
            Entrená uno desde el panel <strong>🧠 Entrenamiento</strong>.
          </p>`;
        return;
      }

      sel.innerHTML =
        '<option value="">— Elegí un dispositivo —</option>' +
        trained.map(d => {
          const lbl = [d.ip, d.hostname].filter(Boolean).join(' / ');
          return `<option value="${d.device_id}">${escapeHtml(lbl)} (${d.n_windows} ventanas)</option>`;
        }).join('');

      sel.addEventListener('change', () => {
        if (sel.value) loadAnomalies(parseInt(sel.value, 10));
        else {
          const c = document.getElementById('anom-content');
          if (c) c.innerHTML = '<p style="color:#64748b;padding:0.75rem 0">Seleccioná un dispositivo para ver sus anomalías.</p>';
        }
      });

      // Auto-cargar si solo hay uno entrenado
      if (trained.length === 1) {
        sel.value = trained[0].device_id;
        loadAnomalies(trained[0].device_id);
      }
    } catch {
      const sel = document.getElementById('anom-device-sel');
      if (sel) sel.innerHTML = '<option value="">Error al cargar dispositivos</option>';
    }
  }

  document.getElementById('anomalies-btn').addEventListener('click', openAnomalies);
  document.getElementById('alerts-btn').addEventListener('click', openAlerts);
  document.getElementById('training-btn').addEventListener('click', openTraining);

  loadDevices();
  refreshAlertsCount();
  setInterval(loadDevices, 30000);
  setInterval(refreshAlertsCount, 30000);
</script>
</body>
</html>
